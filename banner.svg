<?xml version="1.0" encoding="UTF-8"?>
<!--
  H3 Latent Relay · 横幅源文件（21:9 = 1680×720，给 Registry 的 [tool.comfy].Banner 用）
  渲染：magick -background none -density 96 banner.svg -resize 1680x720 -depth 8 -strip banner.png
  ⚠️ 只用 presentation attribute；字体走 Arial（Windows 自带）并留 DejaVu 兜底。
  ⚠️ 版式纪律：右侧文字**不得越过 x=1460**（右下角有 MIT 徽标），否则会被裁掉 —— 改文案后
     必须重新渲染并**看一眼**（`magick identify` 只能告诉你尺寸，不告诉你有没有越界）。
     改完**必须重新渲染 banner.png**（那边才是发布物）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720"
     role="img" aria-label="H3 Latent Relay — latent bridge for MiniMax-H3 multi-segment continuation">
  <title>H3 Latent Relay</title>

  <!-- 底板 + 一抹斜切，避免整块死平 -->
  <rect x="0" y="0" width="1680" height="720" fill="#0F1622"/>
  <path d="M0 640 L1680 400 L1680 720 L0 720 Z" fill="#131C2B"/>
  <rect x="0" y="0" width="1680" height="6" fill="#F5A623"/>
  <rect x="0" y="714" width="1680" height="6" fill="#243A56"/>

  <!-- 左侧图案：复用图标那套语汇（上一段 → 桥 → 本段） -->
  <g transform="translate(88,256) scale(0.92)">
    <rect x="0" y="0" width="150" height="160" rx="18" fill="#1A2433" stroke="#33465F" stroke-width="4"/>
    <rect x="22" y="-18" width="18" height="12" rx="3" fill="#33465F"/>
    <rect x="54" y="-18" width="18" height="12" rx="3" fill="#33465F"/>
    <rect x="86" y="-18" width="18" height="12" rx="3" fill="#33465F"/>
    <rect x="22" y="166" width="18" height="12" rx="3" fill="#33465F"/>
    <rect x="54" y="166" width="18" height="12" rx="3" fill="#33465F"/>
    <rect x="86" y="166" width="18" height="12" rx="3" fill="#33465F"/>
    <path d="M60 50 L112 80 L60 110 Z" fill="#4A6285"/>

    <rect x="264" y="0" width="150" height="160" rx="18" fill="#123147" stroke="#38A3D1" stroke-width="4"/>
    <rect x="286" y="-18" width="18" height="12" rx="3" fill="#38A3D1"/>
    <rect x="318" y="-18" width="18" height="12" rx="3" fill="#38A3D1"/>
    <rect x="350" y="-18" width="18" height="12" rx="3" fill="#38A3D1"/>
    <rect x="286" y="166" width="18" height="12" rx="3" fill="#38A3D1"/>
    <rect x="318" y="166" width="18" height="12" rx="3" fill="#38A3D1"/>
    <rect x="350" y="166" width="18" height="12" rx="3" fill="#38A3D1"/>
    <path d="M325 50 L377 80 L325 110 Z" fill="#7FD8F5"/>

    <rect x="176" y="56" width="62" height="48" rx="24" fill="#F5A623"/>
    <rect x="176" y="56" width="62" height="48" rx="24" fill="none" stroke="#FFD37A" stroke-width="4"/>
    <circle cx="196" cy="80" r="8" fill="#0F1622"/>
    <circle cx="214" cy="80" r="8" fill="#0F1622"/>
    <rect x="150" y="74" width="30" height="12" rx="6" fill="#F5A623" opacity="0.6"/>
    <rect x="234" y="74" width="30" height="12" rx="6" fill="#F5A623" opacity="0.6"/>
  </g>

  <!-- 右侧文字（右边界纪律：不超过 x=1460） -->
  <text x="614" y="286" font-family="Arial, sans-serif" font-weight="bold"
        font-size="92" fill="#EDF4FB" letter-spacing="2">H3 LATENT RELAY</text>
  <rect x="618" y="316" width="150" height="8" rx="4" fill="#F5A623"/>

  <text x="618" y="392" font-family="Arial, sans-serif" font-size="34" fill="#A8BED4">
    Latent bridge for MiniMax-H3 multi-segment continuation
  </text>
  <text x="618" y="440" font-family="Arial, sans-serif" font-size="28" fill="#7E96AD">
    previous segment's AV latent &#8594; next segment's conditioning
  </text>
  <text x="618" y="486" font-family="Arial, sans-serif" font-size="28" fill="#7E96AD">
    zero re-encoding &#183; 8 ComfyUI nodes &#183; no third-party packs
  </text>

  <text x="618" y="612" font-family="Arial, sans-serif" font-size="24" fill="#41586F">
    github.com/ZenHG/ComfyUI-H3-Latent-Relay
  </text>

  <!-- 右下角徽标（放得离文字足够远，避免叠字） -->
  <g transform="translate(1496,570)">
    <rect x="0" y="0" width="118" height="52" rx="26" fill="#F5A623"/>
    <text x="59" y="35" font-family="Arial, sans-serif" font-weight="bold"
          font-size="26" fill="#0F1622" text-anchor="middle">MIT</text>
  </g>
</svg>
