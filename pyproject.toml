# 仅用于元数据（ComfyUI-Manager / Comfy Registry 会读）。
# 不声明 [build-system]：本包是 ComfyUI 自定义节点，不做 pip 打包安装。
#
# ⚠️ 表归属纪律（2026-09-23 修 #11）：`keywords` / `classifiers` / `dependencies` **必须在 [project]
#    段内**。它们曾排在 [project.urls] 之后 ⇒ 按 TOML 规则归属 urls 表 ⇒ 宿主解析器读不到
#    （`comfy_config/config_parser.py` 读的是 project 段）⇒ 依赖声明与平台标签**从未生效**，从 v0.1 起。
#    新增字段时请勿再放到 [project.urls] 后面。
#
# ⚠️ 发布纪律（2026-09-30，Comfy Registry）—— 下面四条**有机检盯着**（`tools/review_050.py` 的 H3k）：
#    ① `name` = registry 的 node id = 安装 URL，**发布后不可改** ⇒ 现在就得定死。官方 Best Practices
#       明写**不要带 "ComfyUI"** ⇒ 旧值 `comfyui-h3-latent-relay` 已改为 `h3-latent-relay`。
#    ② `license` registry 只认 `{ file = … }` / `{ text = … }`，**不收裸 SPDX 字符串**
#       （PEP 639 的 `license = "MIT"` 不在官方文档形态里）⇒ 见下方 license 行。
#    ③ 发布时打包什么由仓库根的 **`.comfyignore`** 决定（默认打包**全部 git 跟踪文件**，
#       那会把 docs/tests/tools 一起推给用户，并扩大安全扫描面）。
#    ④ `PublisherId` 必须与 registry 网站上 @ 后面那串完全一致，否则发布会被拒。
[project]
name = "h3-latent-relay"
version = "0.6.23"
description = "Latent bridge for MiniMax-H3 multi-segment continuation: the previous segment's AV latent is spliced into this segment's conditioning — zero re-encoding."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ZenHG" }]
keywords = ["comfyui", "minimax", "h3", "video", "continuation", "latent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Environment :: GPU :: NVIDIA CUDA",
]
# ⚠️ 只声明**本包代码直接 import 的第三方库**，下限**照抄宿主 ComfyUI requirements.txt 的同名 pin**
#    （av>=17 / numpy>=1.25 / aiohttp>=3.11.8 / safetensors>=0.4.2）⇒ 与宿主**永不冲突**。
#    宿主自有/代管的包（torch · comfy-aimdo · comfy-kitchen · tqdm …）**刻意不列**：它们由 ComfyUI
#    自己管（torch 还要按 CUDA 版本挑 wheel），本包代管只会造成版本漂移。
#    V3 出口缺传递依赖时的处置见 `__init__.py`：**回退 V1 + 出声**（不静默降级）。
dependencies = [
    "safetensors>=0.4.2",
    "av>=17.0.0",
    "numpy>=1.25.0",
    "aiohttp>=3.11.8",
]
# 第三方署名：THIRD-PARTY-NOTICES.md；随包分发的许可全文：LICENSE、licenses/Apache-2.0.txt
# ⚠️ 运行时宿主 ComfyUI 是 GPL-3.0（不复制其代码，但进程内 import），见 THIRD-PARTY-NOTICES.md §一·C
[project.urls]
Repository = "https://github.com/ZenHG/ComfyUI-H3-Latent-Relay"
Homepage = "https://github.com/ZenHG/ComfyUI-H3-Latent-Relay"
Issues = "https://github.com/ZenHG/ComfyUI-H3-Latent-Relay/issues"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # 行长度由 line-length 管；中文 tooltip 本来就有长行
    # —— 以下三条是**刻意保留**的（2026-09-25 接进 CI 时逐条看过，不是懒得改）——
    "E402",   # tools/review_050.py 是**线性脚本**：检查分段写，import 就近放（它的组织方式）
    "E731",   # 测试/工具里的 lambda 简写（`f = lambda: ...`），改 def 只是更长
    "E741",   # 测试/工具里的局部变量 `l`（length/list），改名要动测试代码、收益低
]

# 宿主版本下限：用**官方字段**（宿主 `comfy_config/config_parser.py` 读 comfy_data["requires-comfyui"]）。
# ComfyUI 启动时真的会读它 —— 比只写在注释或 README 里强。
# ⚠️ 它**表达不了「必须带 MiniMax-H3」**（H3 是宿主的 comfy_extras，不是另一个包）⇒ 旧版宿主上本包
#    照样装得上、节点照样出现，只是**续接静默无效**。补法：加载时查 `comfy_extras/nodes_minimax_h3.py`，
#    缺了就**打一行 ❌**（`layout_contract.host_h3_status()` + `__init__.py` 的加载摘要 + `/h3relay/health`）。
#
# 🔢 **为什么是 0.35.0（2026-10-02 定，由 git 历史反查得出，不是拍脑袋）**：
#    本包对宿主最晚的硬依赖是**掩码硬锁机制**，它需要两件东西同时到位：
#      ① `comfy/ldm/minimax/model.py::mask_row_values` —— 把 noise_mask 转成逐 patch 的 timestep 标签
#         ⇒ 首次出现 `ff6c8a8af`（#15375 per-token noise masks），**落在 v0.34.0**；
#      ② `comfy/ldm/minimax/model.py` forward 里的 `out[0] *= denoise_mask / out[1] *= audio_denoise_mask`
#         —— 把掩码行的**速度场**按掩码缩放（缺它 ⇒ masked rows 的速度预测不准 ⇒ 硬锁数值偏）
#         ⇒ 首次出现 `421a1c245`（#15988 Fix MiniMax H3 denoise masks），**落在 v0.35.0**。
#    更早的依赖都更早：`FRAME_PER_TOKEN` / `PackedLayout` / `minimax_keyframes` / `minimax_refs`
#      = v0.30.0（#15224）；`_scale_audio_slice` = 2026-08-06；`NestedTensor` = 2025-10；
#      `conditioning_set_values` = 2026-02；`comfy_api` = 2025-07。
#    **已核实 v0.35.0 → HEAD 之间 `mask_row_values` / `_denoise_mask_values` 未被改动**
#      （`git log v0.35.0..HEAD -S <sym>` 空），故 v0.35.0 是**充分且必要**的下限。
#    ⚠️ 旧值 `>=0.37.0` **过高三档**，会让本可用的用户装不上（本包并不依赖 0.36/0.37 的任何特性）。
#    ⚠️ **将来若要放宽/收紧**：先跑 `git log --oneline -1 -S <符号> -- comfy/` 反查，别凭感觉写。
[tool.comfy]
requires-comfyui = ">=0.35.0"

# —— Comfy Registry 发布所需 ——
# PublisherId：在 registry.comfy.org 注册发布者后获得（全局唯一、**发布后不可更改**）。
PublisherId = "zenhg"
DisplayName = "H3 Latent Relay"
# 与画布的节点分类同名（`nodes.py` 的 CATEGORY）⇒ Manager 卡片与画布菜单一致，利于检索。
# Icon：registry / Manager 卡片的方图，≤ 400×400、须为公网可取 ⇒ 用 raw 直链（文件随仓提交）。
Icon = "https://raw.githubusercontent.com/ZenHG/ComfyUI-H3-Latent-Relay/main/icon.png"
# Banner：registry 节点页顶部的横幅，**21:9**、同样须公网可取（也走 raw 直链，文件随仓提交）。
# ⚠️ 直链要等**这份文件被推到 main** 之后才有效 —— 只提交不推 ⇒ registry 页面上是空图。
Banner = "https://raw.githubusercontent.com/ZenHG/ComfyUI-H3-Latent-Relay/main/banner.png"
