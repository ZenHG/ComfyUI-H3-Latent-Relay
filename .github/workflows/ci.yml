# 回归五件套（CPU-only、零 GPU、秒级）
#
# 失败时都会以非零退出码退出（tests/test_relay_core.py:1822、tools/review_050.py:864、
# tools/smoke_nodes.py:236、tools/assert_default_exit.py、tests/test_v3_schema.py），
# 所以不需要额外解析输出。
#
# 期望值：
#   · 384/0  tests/test_relay_core.py      算法层
#   ·  82/0  tools/review_050.py           文档—代码一致性
#   ·  15/0  tools/smoke_nodes.py          节点层冒烟
#   ·   4/4  tools/assert_default_exit.py  默认出口 = V3（契约 1 + 行为 3；必须单进程、不设环境变量）
#   ·  58/0  tests/test_v3_schema.py       V3 与 V1 逐字段一致（**CI 里 7 节点 / 98 input**；
#                                          本机装齐上游超分节点包时 65/0 / 8 节点 / 111 input）
#   ·  29/0  tests/test_prompt_dispatch.mjs  Chain 词分发纯函数（node）
# 改动后若这些数字变了，请同步 CONTRIBUTING.md「方面数/断言数」与 tests 头注释。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只需要 ComfyUI 作为「宿主」：comfy.nested_tensor / node_helpers / folder_paths
      # 都是纯 Python，不装它的依赖（torch 单独用 CPU 版装，避免拖 CUDA 包）。
      - name: Fetch ComfyUI (host only)
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git "$RUNNER_TEMP/ComfyUI"

      # 🔴 为什么必须装**宿主自己的整套 Python 依赖**（而不是逐个补）：
      # 默认出口自 2026-09-24 起是 V3，而 V3 会 import `comfy_api.latest` —— 它的依赖闭包
      # 就是宿主自己的整套依赖。逐个补会变成"打地鼠"：2026-09-24 一天内连红三次，
      # 依次缺 packaging → comfy-aimdo → tqdm（前两个现已写进宿主 requirements.txt）。
      # 主宿主的 requirements.txt 里加依赖时，这里自动跟上，不会再漏。
      #
      # 只排除两类：
      #   · torch 三件套（torch/torchsde/torchvision/torchaudio）—— 上面用 CPU 版单独装，
      #     避免 CI 拖 CUDA 包；
      #   · 前端三件套（comfyui-frontend-package / workflow-templates / embedded-docs）——
      #     纯前端资源，Python import 闭包用不到，省几十 MB 与时间。
      - name: Install host runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          grep -viE '^\s*(torch|torchvision|torchaudio|torchsde)\b' "$RUNNER_TEMP/ComfyUI/requirements.txt" \
            | grep -viE '^\s*(comfyui-frontend-package|comfyui-workflow-templates|comfyui-embedded-docs)\b' \
            | grep -vE '^\s*#|^\s*$' > "$RUNNER_TEMP/host-requirements.txt"
          echo "--- 将安装的宿主依赖 ---"; cat "$RUNNER_TEMP/host-requirements.txt"
          pip install -r "$RUNNER_TEMP/host-requirements.txt"

      - name: Regression trio
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: |
          python tests/test_relay_core.py   # 期望 384/0
          python tools/review_050.py        # 期望 82/0
          python tools/smoke_nodes.py       # 期望 15/0

      # 默认出口 = V3（2026-09-24 从 v1 切过来）。**必须单跑一个进程**：
      # test_v3_schema 会把 H3RELAY_NODE_API 写死成 v3，同进程里验不出"默认"。
      - name: Assert default exit is v3
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tools/assert_default_exit.py   # 期望 3/3

      # V3 外壳与 V1 的逐字段一致性（零 GPU）。默认出口现在是 V3 ⇒ 它必须被 CI 覆盖。
      # ⚠️ CI 期望数是 **58/0（7 节点 / 98 input）**，不是本机的 65/0：
      #    `H3RelayLatentUpscale` 要上游节点包 `MinimaxH3LatentUpscaler3D`，CI 里没装 ⇒
      #    该节点诚实降级被跳过（不是失败；脚本会把实际节点数与 input 数打在结果行里）。
      #    本机装齐上游包时为 65/0（8 节点 / 111 input）。
      - name: V3 schema parity (vs V1)
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tests/test_v3_schema.py       # CI 期望 58/0（7 节点）

      # Chain 词分发的纯函数（与浏览器里跑的是同一份 web/relay_kit_prompt.js）
      - name: Chain prompt dispatch (node)
        run: node tests/test_prompt_dispatch.mjs   # 期望 29/0
