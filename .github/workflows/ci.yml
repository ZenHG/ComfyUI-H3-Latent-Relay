# 回归三件套（CPU-only、零 GPU、秒级）
#
# 三个脚本在失败时都会以非零退出码退出（tests/test_relay_core.py:1822、
# tools/review_050.py:864、tools/smoke_nodes.py:236），所以不需要额外解析输出。
#
# 期望值：362/0（算法层）、80/0（文档—代码一致性）、15/0（节点层冒烟）、29/0（Chain 纯函数，node）。
# 改动后若这些数字变了，请同步 CONTRIBUTING.md「方面数/断言数」与 tests 头注释。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只需要 ComfyUI 作为「宿主」：comfy.nested_tensor / node_helpers / folder_paths
      # 都是纯 Python，不装它的依赖（torch 单独用 CPU 版装，避免拖 CUDA 包）。
      - name: Fetch ComfyUI (host only)
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git "$RUNNER_TEMP/ComfyUI"

      # ComfyUI 的 node_helpers 会 import PIL（Pillow），comfy.* 要 numpy；
      # 这里不装 ComfyUI 的完整 requirements（那会拖来 CUDA 版的 torch），只补最小集。
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "safetensors>=0.4" pillow numpy "av>=17"

      - name: Regression trio
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: |
          python tests/test_relay_core.py   # 期望 362/0
          python tools/review_050.py        # 期望 80/0
          python tools/smoke_nodes.py       # 期望 15/0

      # Chain 词分发的纯函数（与浏览器里跑的是同一份 web/relay_kit_prompt.js）
      - name: Chain prompt dispatch (node)
        run: node tests/test_prompt_dispatch.mjs   # 期望 29/0
