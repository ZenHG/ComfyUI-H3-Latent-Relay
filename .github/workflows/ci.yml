# 回归五件套（CPU-only、零 GPU、秒级）
#
# 失败时都会以非零退出码退出（tests/test_relay_core.py:1822、tools/review_050.py:864、
# tools/smoke_nodes.py:236、tools/assert_default_exit.py、tests/test_v3_schema.py），
# 所以不需要额外解析输出。
#
# 期望值：
#   · 392/0  tests/test_relay_core.py      算法层
#   ·  86/0  tools/review_050.py           文档—代码一致性（✅ 本数字由**本文件的 H3g 自引用机检**盯着）
#   ·  15/0  tools/smoke_nodes.py          节点层冒烟
#   ·   4/4  tools/assert_default_exit.py  默认出口 = V3（契约 1 + 行为 3；必须单进程、不设环境变量）
#   ·  69/0  tests/test_v3_schema.py       V3 与 V1 逐字段一致（**8 节点 / 112 个 input**，
#                                          CI 与本机**一致** —— 见下方 2026-09-25 的更正）
#   ·  29/0  tests/test_prompt_dispatch.mjs  Chain 词分发纯函数（node）
# 改动后若这些数字变了，请同步 CONTRIBUTING.md「方面数/断言数」、tests 头注释 **以及本文件**。
# ⚠️ 本文件曾是**已知盲区**（自己漂移过：停在 384；`assert_default_exit` 的期望值与第 11 行
#    自相矛盾 3/3 vs 4/4；`review_050` 的执行行写 82 而真值 83）。2026-09-25 已收口：
#      · `tests/test_relay_core.py` → **H3f**（逐行扫，头注释与执行行**都**认）
#      · `tools/review_050.py`      → **H3g**（自引用，必须是该文件最后一个检查）
#      · `tests/test_v3_schema.py`  → **H3h**（核本文件 + docs/08 + README + `__init__` 的
#        节点数 / input 数 / 机检项数三组声明）
# 🔴 2026-09-25 更正一个**错误前提**：本文件原先写「CI 的节点数 / input 数比本机少，
#    因为 CI 没装上游超分节点包」。实测**不成立** —— 宿主 ComfyUI **自带**注册
#    `latent_upscale_models`（`folder_paths.py:43`），所以 `H3RelayLatentUpscale` 的
#    `INPUT_TYPES()` **永不抛错**、永不被 V3 entrypoint 的逐节点容错跳过
#    ⇒ **两边恒为 8 节点 / 112 个 input**。
#    （验证手法：把上游节点从宿主注册表摘掉，`get_node_list()` 仍是 8 个。）
#    那组偏小的数字只活在**注释**里、无人断言，所以 CI 一直绿着而文档一直是错的。
#    ⇒ 现在两边一致，这组数字已由 **H3h** 机检。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只需要 ComfyUI 作为「宿主」：comfy.nested_tensor / node_helpers / folder_paths
      # 都是纯 Python，不装它的依赖（torch 单独用 CPU 版装，避免拖 CUDA 包）。
      - name: Fetch ComfyUI (host only)
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git "$RUNNER_TEMP/ComfyUI"

      # 🔴 为什么必须装**宿主自己的整套 Python 依赖**（而不是逐个补）：
      # 默认出口自 2026-09-24 起是 V3，而 V3 会 import `comfy_api.latest` —— 它的依赖闭包
      # 就是宿主自己的整套依赖。逐个补会变成"打地鼠"：2026-09-24 一天内连红三次，
      # 依次缺 packaging → comfy-aimdo → tqdm（前两个现已写进宿主 requirements.txt）。
      # 主宿主的 requirements.txt 里加依赖时，这里自动跟上，不会再漏。
      #
      # 只排除两类：
      #   · torch 三件套（torch/torchsde/torchvision/torchaudio）—— 上面用 CPU 版单独装，
      #     避免 CI 拖 CUDA 包；
      #   · 前端三件套（comfyui-frontend-package / workflow-templates / embedded-docs）——
      #     纯前端资源，Python import 闭包用不到，省几十 MB 与时间。
      - name: Install host runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          grep -viE '^\s*(torch|torchvision|torchaudio|torchsde)\b' "$RUNNER_TEMP/ComfyUI/requirements.txt" \
            | grep -viE '^\s*(comfyui-frontend-package|comfyui-workflow-templates|comfyui-embedded-docs)\b' \
            | grep -vE '^\s*#|^\s*$' > "$RUNNER_TEMP/host-requirements.txt"
          echo "--- 将安装的宿主依赖 ---"; cat "$RUNNER_TEMP/host-requirements.txt"
          pip install -r "$RUNNER_TEMP/host-requirements.txt"

      # 静态检查（配置在 pyproject.toml 的 [tool.ruff]）。
      # ⚠ 2026-09-25 才真正接进来 —— 之前配置一直在、却**从没跑过**，属"形同虚设"。
      # 零 GPU、秒级 ⇒ 放最前，快速失败。`--exclude dist`：那是 make_minimal_bundle 的生成物。
      - name: Lint (ruff)
        run: |
          pip install -q ruff
          ruff check . --exclude dist

      - name: Regression trio
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: |
          python tests/test_relay_core.py   # 期望 392/0
          python tools/review_050.py        # 期望 86/0（H3g 自引用机检）
          python tools/smoke_nodes.py       # 期望 15/0

      # 默认出口 = V3（2026-09-24 从 v1 切过来）。**必须单跑一个进程**：
      # test_v3_schema 会把 H3RELAY_NODE_API 写死成 v3，同进程里验不出"默认"。
      - name: Assert default exit is v3
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tools/assert_default_exit.py   # 期望 4/4

      # V3 外壳与 V1 的逐字段一致性（零 GPU）。默认出口现在是 V3 ⇒ 它必须被 CI 覆盖。
      # ⚠️ 2026-09-25 更正：这里原先写「CI 的节点数 / input 数比本机少」（前提 = CI 没装上游
      #    超分节点包）—— **前提是错的**。宿主 ComfyUI 自带注册 `latent_upscale_models`
      #    （`folder_paths.py:43`）⇒ `H3RelayLatentUpscale.INPUT_TYPES()` 永不抛错、永不被跳过
      #    ⇒ CI 与本机**恒为 8 节点 / 112 个 input**，数字两边一致。
      - name: V3 schema parity (vs V1)
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tests/test_v3_schema.py       # 期望 69/0（8 节点 / 112 个 input）

      # Chain 词分发的纯函数（与浏览器里跑的是同一份 web/relay_kit_prompt.js）
      - name: Chain prompt dispatch (node)
        run: node tests/test_prompt_dispatch.mjs   # 期望 29/0
