# 回归套件（CPU-only、零 GPU、秒级）：
#   ruff 静态检查 → 回归五件套 → 默认出口断言 → V3 逐字段一致 → JS 词分发 → **分发集构建+自验**
#
# 失败时都会以非零退出码退出（这几个脚本都以自己的退出码表达成败）。
# ⚠️ 行号不写在这里 —— 2026-10-07 拆包后 test_relay_core.py 从 3996 行变成 180 行，
#    写死的行号当场全错；会漂的东西别写。
# 所以不需要额外解析输出。
#
# 期望值：
#   · 563/0  tests/test_relay_core.py      算法层
#   ·  117/0  tools/review_050.py           文档—代码一致性（✅ 本数字由**本文件的 H3g 自引用机检**盯着）
#   ·  16/0  tools/smoke_nodes.py          节点层冒烟（✅ H3j 自 2026-09-30 起机检）
#   ·   5/5  tools/assert_default_exit.py  默认出口 = V3（契约 2 + 行为 3；必须单进程、不设环境变量）
#   ·  72/0  tests/test_v3_schema.py       V3 与 V1 逐字段一致（**8 节点 / 122 个 input**）
#                                          ⚠️ 2026-10-07 起**只有一个数**了：节点在不在场只由它
#                                          自己的 `INPUT_TYPES()` 决定，与"宿主 `nodes` 能不能
#                                          import"无关（原因见下方「为什么 V3 机检只有一个数」）
#   ·  期望 43/0  tests/test_prompt_dispatch.mjs  前端纯函数（词分发 + run_id 同步 + 阶段表对账）（node）
#   ·  期望 29/0  tests/test_run_id_parity.mjs   run_id 同步的跨层对账（与 Python 第 34 组共用一份 fixture）（node）
#   ·  期望 45/0  tests/test_audio_ref_budget.mjs  前端纯函数（音频参考额度：3 槽 + 本包 1）（node）
#   ·  期望 33/0  tests/test_i18n.mjs            前端纯函数（画布中英切换：标签 + 悬浮提示）（node）
# 改动后若这些数字变了，请同步 CONTRIBUTING.md「方面数/断言数」、tests 头注释 **以及本文件**。
# ⚠️ 本文件曾是**已知盲区**（自己漂移过：停在 384；`assert_default_exit` 的期望值与第 11 行
#    自相矛盾 3/3 vs 4/4；`review_050` 的执行行写 82 而真值 83）。2026-09-25 已收口：
#      · `tests/test_relay_core.py` → **H3f**（逐行扫，头注释与执行行**都**认）
#      · `tools/review_050.py`      → **H3g**（自引用，必须是该文件最后一个检查）
#      · `tests/test_v3_schema.py`  → **H3h**（核本文件 + docs/08 + README + `__init__` 的
#        节点数 / input 数 / 机检项数三组声明）
#      · `tools/assert_default_exit.py` → **H3i**（核本文件 + docs/08 + tools/README）
#      · `tools/smoke_nodes.py`     → **H3j**（2026-09-30 加：此前它是**唯一"多处声明却无机检"的数字**，
#        实测在 4 个文件里停在旧值而真值为 16/0 —— 修完顺手装机检，防下一次）
#
# ⚠️ **已知覆盖缺口（诚实记录，别把它当成已覆盖）**：
#   1. **只跑一个 Python 版本（3.11）**，而 `requires-python = ">=3.10"`、ruff `target-version = "py310"`
#      ⇒ 3.10 上的兼容性**没有 CI 覆盖**；加 matrix 会让"装宿主依赖"那一步翻倍（时间成本高），暂缓；
#   2. **宿主依赖不固定版本**（直接吃宿主 `requirements.txt` 的当前状态）⇒ 上游漂移会造成与本包无关的红（噪声）；
#   3. `dist/` 被 ruff 排除（它是生成物）—— 但**分发集现在会被真的构建并自验**（见最后一步），
#      此前它零 CI 覆盖（2026-09-30 实测：打包器缺 `import subprocess`，CI 全绿而真跑 NameError）。
# 🔴 **为什么 V3 机检现在只有一个数**（2026-09-25 首测 / 2026-09-30 修正机制 / **2026-10-07 收敛**）：
#    `H3RelayLatentUpscale.INPUT_TYPES()` 要问 `_comfy_registry()` 拿**宿主**节点注册表，
#    好去里面找上游包（作者的 MinimaxH3LatentUpscaler3D）：
#    · 注册表**拿得到** ⇒ 上游不在里面 ⇒ `_upscaler_cls()` 抛 **RuntimeError**
#      ⇒ `_upscaler_module()` **捕获它**（按设计）⇒ 退回 `get_filename_list`
#      （宿主自带注册 `latent_upscale_models`）⇒ INPUT_TYPES 不抛。
#    · 注册表**拿不到**（宿主 `nodes` 导不进来 / 被本包目录遮成影子模块）⇒ 同样收敛成
#      **RuntimeError** ⇒ 同样被吞 ⇒ **它照样在场**。
#    ⇒ 两种环境**都是 8 节点 / 122 input / 72 项**。
#    🔴 2026-10-07 之前不是这样：`_comfy_registry()` 里的 `import nodes` 若抛 **ImportError**
#      会**穿透**出去（`_upscaler_module()` 只 `except RuntimeError`）⇒ INPUT_TYPES 抛
#      ⇒ V3 外壳的逐节点容错**静默跳过该节点** ⇒ **7 节点 / 63 项**。
#      那个"第三档"只在 `sys.modules["nodes"] = None` 这种**人工硬挡**下出现 ——
#      也就是说 `tools/ci_env_repro.py` 复现出来的**从来不是 CI 真正进入的状态**（CI 抛的是
#      RuntimeError，被吞 ⇒ 8 节点）。**旧文档把一个人造态写成了"CI 的环境"，那是错的。**
#      修法（`nodes.py::_comfy_registry`）：**先扫 `sys.modules`**（既更准，又不会把一个同名的
#      影子 `nodes.py` 重新 exec 一遍 —— 那正是本函数注释里写明要避免的事），再 `import nodes`
#      且**兜住任何异常** ⇒ 失败一律收敛成该函数声明的那一种（RuntimeError）。
#    ⇒ 判据仍由**节点自己的 `INPUT_TYPES()`** 回答（`test_v3_schema.py` 的 2.1），
#      **不是**由"宿主 nodes 能不能 import"去推（2026-09-30 实测：后者会给出**相反**结论 ⇒ 假红）。
#    ⚠️ 别用"只把上游节点从注册表摘掉"模拟"没有注册表" —— 那是「装了宿主没装上游包」，仍是 8 节点。
#       复现"没有宿主注册表"：`sys.modules["nodes"] = None` 后跑该测试（工具版
#       `python tools/ci_env_repro.py tests/test_v3_schema.py`）⇒ **同样 72/0 · 8 节点**。
#    🔴 2026-09-30 补记：这两行曾写成「8 节点」（跨行"跳过它 ⇒ 8 节点"）而**H3h 放过了**——
#       因为它的判据只查"值在声明集合里"，不查 (节点数, input 数) **配对**。
#       ⇒ 已把 H3h 收紧为**配对校验**，并修掉本文件这两处（机检的强弱也是被测对象）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ⚠️ 2026-09-30 从 v4 升到 v6：v4 跑在 Node 20 上，而 Node 20 已被 GitHub 标记弃用
      #    （运行日志里一直在警告"forced to run on Node.js 24"）⇒ 到期会硬失败。
      #    `allow-unsafe-pr-checkout` 只对 `pull_request_target` / `workflow_run` 必需 ——
      #    本工作流用的是普通 `pull_request`（只读、无 secrets），不需要那个输入。
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 只需要 ComfyUI 作为「宿主」：comfy.nested_tensor / node_helpers / folder_paths
      # 都是纯 Python，不装它的依赖（torch 单独用 CPU 版装，避免拖 CUDA 包）。
      - name: Fetch ComfyUI (host only)
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git "$RUNNER_TEMP/ComfyUI"

      # 🔴 为什么必须装**宿主自己的整套 Python 依赖**（而不是逐个补）：
      # 默认出口自 2026-09-24 起是 V3，而 V3 会 import `comfy_api.latest` —— 它的依赖闭包
      # 就是宿主自己的整套依赖。逐个补会变成"打地鼠"：2026-09-24 一天内连红三次，
      # 依次缺 packaging → comfy-aimdo → tqdm（前两个现已写进宿主 requirements.txt）。
      # 主宿主的 requirements.txt 里加依赖时，这里自动跟上，不会再漏。
      #
      # 只排除两类：
      #   · torch 三件套（torch/torchsde/torchvision/torchaudio）—— 上面用 CPU 版单独装，
      #     避免 CI 拖 CUDA 包；
      #   · 前端三件套（comfyui-frontend-package / workflow-templates / embedded-docs）——
      #     纯前端资源，Python import 闭包用不到，省几十 MB 与时间。
      - name: Install host runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          grep -viE '^\s*(torch|torchvision|torchaudio|torchsde)\b' "$RUNNER_TEMP/ComfyUI/requirements.txt" \
            | grep -viE '^\s*(comfyui-frontend-package|comfyui-workflow-templates|comfyui-embedded-docs)\b' \
            | grep -vE '^\s*#|^\s*$' > "$RUNNER_TEMP/host-requirements.txt"
          echo "--- 将安装的宿主依赖 ---"; cat "$RUNNER_TEMP/host-requirements.txt"
          pip install -r "$RUNNER_TEMP/host-requirements.txt"

      # 静态检查（配置在 pyproject.toml 的 [tool.ruff]）。
      # ⚠ 2026-09-25 才真正接进来 —— 之前配置一直在、却**从没跑过**，属"形同虚设"。
      # 零 GPU、秒级 ⇒ 放最前，快速失败。`--exclude dist`：那是 make_minimal_bundle 的生成物。
      - name: Lint (ruff)
        run: |
          pip install -q ruff
          ruff check . --exclude dist

      - name: Regression suite
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: |
          python tests/test_relay_core.py   # 期望 563/0
          python tools/review_050.py        # 期望 117/0（H3g 自引用机检；I1–I4 覆盖**全部**示例图；L13 + H3j/H3k/H3l/H3m + H3n i18n 词表 + H3p i18n 悬浮提示 + H3q JS 逗号表达式 + H3r 防覆盖兜底 + H3s link 端点字段 + H3t 官方语言入口 + H3o 文档悬空引用 + **H3u registry 包文件数真值 + H3v tools 脚本数真值 + H3w 未跟踪文件 + H3x setdefault-到-PYTHONPATH + H3y tools 脚本登记 + H3z release.py flag 齐全 + H4a Python 子进程显式 env + H4b 判据表自检 + H4c 台账一致 + H4d JS 期望数真值 + H4e dist 白名单真值 + H4f return-open 盲点** + I4 示例图节点数）
          python tools/smoke_nodes.py       # 期望 16/0
          # 这两个此前**只在本地清单里、CI 没跑**（2026-09-30 补齐覆盖缺口）：
          python tests/test_experimental.py                              # 期望 失败 0（实验层）
          python tools/check_ui_workflow.py examples/minimal_relay_official.json   # 期望「问题合计 0 条」

      # 默认出口 = V3（2026-09-24 从 v1 切过来）。**必须单跑一个进程**：
      # test_v3_schema 会把 H3RELAY_NODE_API 写死成 v3，同进程里验不出"默认"。
      - name: Assert default exit is v3
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tools/assert_default_exit.py   # 期望 5/5

      # V3 外壳与 V1 的逐字段一致性（零 GPU）。默认出口现在是 V3 ⇒ 它必须被 CI 覆盖。
      # **一个数**：`72/0 · 8 节点 / 122 个 input` —— "有没有宿主注册表"两条路都收敛到这一档。
      # 差的那个节点是 `H3RelayLatentUpscale`，它的 INPUT_TYPES 靠 `_upscaler_module()` 兜
      # RuntimeError；2026-10-07 把 `_comfy_registry()` 的 ImportError 穿透堵掉后，
      # "7 节点 / 63 项"那个第三档**不再可达**（详见文件头）。
      # 🔴 判据在测试里由**节点自己的 INPUT_TYPES()** 回答，不是由"宿主 nodes 能不能 import"推。
      # 🔴 `if: always()`（2026-09-30 加）：GitHub 默认**首败即停** ⇒ 上一步一红，
      #    这一步的输出根本不会出现在日志里（实测：review_050 红了一次，
      #    "V3 schema parity" 这步的真实输出全被吞掉，只能靠再推一版来猜）。
      #    它自己失败照样让 job 红 —— `always()` 只影响"跑不跑"，不影响成败判定。
      - name: V3 schema parity (vs V1)
        if: always()
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tests/test_v3_schema.py       # 期望 72/0（8 节点 / 122 个 input；有没有宿主注册表都是这一档）

      # Chain 词分发的纯函数（与浏览器里跑的是同一份 web/relay_kit_prompt.js）
      - name: Chain prompt dispatch (node)
        run: node tests/test_prompt_dispatch.mjs   # 期望 43/0

      # 🔴 run_id 同步语义的**跨层对账**（0.6.31 新增）：前端 web/relay_kit_sync.js 与
      #    后端 relay_core/plan.py 是同一套语义的两份实现（规范 §二·D「跨层孪生」）。
      #    本步读 tests/parity/run_id_cases.json，Python 侧第 34 组读**同一个文件** ⇒
      #    任何一侧单方面改语义，两边都会红。⚠️ 别删本步：删掉之后两侧就只剩"看着一样"。
      - name: run_id parity (node side)
        run: node tests/test_run_id_parity.mjs   # 期望 29/0

      # ⚠️ 浏览器交互冒烟（tools/ui_smoke.cjs）**故意不在 CI 里**：
      #    它要一个**活着的 ComfyUI**（点按钮 ⇒ 前端 ⇒ /prompt）+ 一个浏览器；
      #    本仓 CI 两者都没有 ⇒ 加进去只会得到一个永远 SKIP 的假门。
      #    本机一条命令跑：node tools/ui_smoke.cjs（详见 tools/README.md 与 LOCAL 规范 §七-22）。

      # 音频参考额度的纯函数（与浏览器里跑的是同一份 web/relay_kit_refs.js）。
      # 🔴 为什么必须进 CI：这组的核心是两条**静默失效**回归 —— ① 槽位正则不认 Autogrow 的
      #    `ref_audios.ref_audio_0`（⇒ 计数恒 0 ⇒ 越界警告永不出现）；② 标题后缀不幂等
      #    （⇒ 每次刷新把后缀再叠一遍）。两者都不会报错，只有单测能拦。
      - name: Audio ref budget (node)
        run: node tests/test_audio_ref_budget.mjs   # 期望 45/0

      # 中英切换（0.6.28 新增；纯函数在 web/relay_kit_i18n.js，与浏览器跑同一份）。
      # 🔴 为什么必须进 CI：这组的核心是**静默失效**回归 —— ① 改 `name` 而不是 `label`
      #    （= 改图：工作流脏、连线错位）；② 整段替换 `title` ⇒ 抹掉 `relay_kit_refs_ui.js`
      #    追加的额度提示；③ 枚举白名单外的值被猜译（模型文件名翻了 = 找不到文件）。
      #    三条都不会报错，只有单测能拦。
      - name: Canvas i18n (node)
        run: node tests/test_i18n.mjs   # 期望 33/0

      # 🔴 2026-09-30 新增：**真的构建一次分发集**（此前它零 CI 覆盖）。
      #    为什么必须进 CI：用户下载的就是 `dist/` 那个 zip —— 打包器坏了、或
      #    英文文档没同步（打包器第一步就是 en_sync 前置闸），都必须在**发布前**被拦住，
      #    而不是等打了包、发了 release 才发现。实证：2026-09-30 打包器缺 `import subprocess`，
      #    CI 当时**全绿**，是我手动真跑一次才暴露的。
      #    `--force` 允许覆盖（checkout 里本没有 dist/，写的是仓库外的临时副本也会用同一路径）。
      - name: Build minimal distribution set
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tools/make_minimal_bundle.py --zip --force

      # 🔴 2026-10-07 新增：**外部开源用户视角**冒烟（`git clone` 那条渠道）。
      #    为什么必须有：上面所有步骤都在**原仓里**跑 ⇒ 证明不了"clone 出来的那份自足"。
      #    2026-10-07 把 `relay_core.py` 拆成 `relay_core/` 包（11 文件）时，缺一个文件
      #    就会让所有用户装不上 —— 而原仓里跑什么都看不出来。
      #    它按 `git ls-files` 复制一份干净副本，断言：两个出口（默认 V3 / `H3RELAY_NODE_API=v1`）
      #    都注册同样一批节点、`INPUT_TYPES()` 全可求值、前端 JS 在位、**模块零外泄**；
      #    再从 `dist/` **真跑一次节点方法**（不是只看 schema）。
      - name: User-copy smoke (external user view)
        env:
          COMFYUI_PATH: ${{ runner.temp }}/ComfyUI
          PYTHONPATH: ${{ runner.temp }}/ComfyUI
        run: python tools/user_smoke.py           # 期望「通过 10 / 失败 0」
